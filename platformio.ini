; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:wemos_d1_mini32]
; espressif32 6.9.0 = Arduino-ESP32 core 2.0.17 (pinned, like the libraries)
platform = espressif32 @ 6.9.0
board = wemos_d1_mini32
framework = arduino
monitor_speed = 115200
build_flags =
	-DELEGANTOTA_USE_ASYNC_WEBSERVER=1
; Exact versions (same web server / OTA stack as xGlow_AI). ElegantOTA 3 runs on the async
; web server only with -DELEGANTOTA_USE_ASYNC_WEBSERVER=1 (see build_flags).
lib_deps =
	adafruit/Adafruit SSD1306 @ 2.5.17
	adafruit/Adafruit GFX Library @ 1.12.6
	adafruit/Adafruit BusIO @ 1.17.4
	esp32async/ESPAsyncWebServer @ 3.12.1
	esp32async/AsyncTCP @ 3.5.0
	ayushsharma82/ElegantOTA @ 3.1.7
	adafruit/Adafruit MAX31865 library @ 1.6.2
	drhaney/pt100rtd library @ 0.1
	yuriisalimov/MAX6675_Thermocouple @ 2.0.2
	r-downing/AutoPID @ 1.0.3

[env:d1mini]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps = 
	adafruit/Adafruit SSD1306@^2.4.0
	ottowinter/ESPAsyncWebServer-esphome@^1.2.7
	adafruit/Adafruit GFX Library@^1.10.1
	adafruit/Adafruit MAX31865 library@^1.2.3
	drhaney/pt100rtd library@^0.1
	yuriisalimov/MAX6675_Thermocouple@^2.0.2
	adafruit/MAX6675 library@^1.1.0
	r-downing/AutoPID@^1.0.3
